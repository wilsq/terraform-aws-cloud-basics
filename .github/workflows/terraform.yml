# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest


    # TÄMÄ OSA LUKEE TUNNUKSET SALAISUUKSISTA
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "eu-north-1"

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TÄMÄ ASENTAA TERRAFORMIN VIRTUAALIKONEELLE
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # TÄMÄ TARKISTAA KOODIN TYYLILAJIN (fmt)
      - name: Terraform Format
        run: terraform fmt -check

      # TÄMÄ ALUSTAA PROJEKTIN (init)
      - name: Terraform Init
        run: terraform init

      # TÄMÄ VALIDOI SYNTAKSIN (validate)
      - name: Terraform Validate
        run: terraform validate

      # TÄMÄ NÄYTTÄÄ MITÄ MUUTOKSIA INFRALLE TEHTÄISIIN
      - name: Terraform Plan
        run: terraform plan -input=false
